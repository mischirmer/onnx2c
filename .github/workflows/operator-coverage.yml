name: Operator Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

concurrency:
  group: 'operator-coverage'
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libprotobuf-dev protobuf-compiler cmake build-essential

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target onnx2c testgen testgen_singlefile -j$(nproc)

      - name: Run exhaustive coverage
        run: |
          python3 test/operator_coverage/run_coverage.py \
            --mode exhaustive \
            --onnx2c build/onnx2c \
            --testgen build/test/testgen \
            --testgen-singlefile build/test/testgen_singlefile \
            --output-dir coverage-out \
            --jobs $(nproc) \
            --timeout 120

      - name: Validate report
        run: |
          test -f coverage-out/operator-coverage.json
          python3 -c "import json; r=json.load(open('coverage-out/operator-coverage.json')); assert r['validation']['ok'], r['validation']['errors']; assert r['campaign']['complete'], 'exhaustive campaign did not complete'; t=r['totals']; print('campaign complete:  ', r['campaign']['complete']); print('infrastructure clean:', r['campaign'].get('clean')); print('discovered cases:   ', t['discovered_cases']); print('passed cases:       ', t['passed_cases']); print('cases per category: ', t['cases_per_category']); print('verified operators: %d/%d' % (t['default_domain_verified'], t['spec_operators_default_domain']))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-coverage
          path: coverage-out

      - name: Publish coverage data
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" remote add origin "$remote"
          if git -C "$work" fetch -q --depth 1 origin coverage-data; then
            git -C "$work" checkout -q -b coverage-data FETCH_HEAD
          else
            git -C "$work" checkout -q --orphan coverage-data
          fi
          cp coverage-out/operator-coverage.md "$work/operator-coverage.md"
          cp coverage-out/operator-coverage.json "$work/operator-coverage.json"
          rm -rf "$work/badges"
          cp -r coverage-out/badges "$work/badges"
          git -C "$work" add operator-coverage.md operator-coverage.json badges
          if git -C "$work" diff --cached --quiet; then
            echo "coverage data unchanged"
          else
            git -C "$work" -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update operator coverage data [skip ci]"
            git -C "$work" push -q origin coverage-data
          fi
