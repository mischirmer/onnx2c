name: Operator Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

concurrency:
  group: operator-coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build onnx2c and test generators
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libprotobuf-dev protobuf-compiler
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target onnx2c testgen testgen_singlefile

      - name: Run coverage tool self-tests
        run: python3 test/operator_coverage/test_coverage.py

      - name: Run coverage campaign
        run: |
          python3 test/operator_coverage/coverage.py \
            --repo-root . --output-dir coverage-out \
            --jobs "$(nproc)" --timeout 120

      - name: Check report
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open("coverage-out/operator-coverage.json"))
          assert r["validation"]["ok"], r["validation"]["errors"]
          assert r["campaign"]["complete"], "campaign did not complete"
          t = r["totals"]
          print("active operators:   ", t["spec_operators_active"],
                "(deprecated: %d)" % t["spec_operators_deprecated"])
          print("verified operators: ", "%d/%d" % (t["active_verified"],
                t["spec_operators_active"]))
          print("active test cases:  ", "%d/%d" % (t["active_passed_cases"],
                t["active_cases"]))
          PY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-coverage
          path: coverage-out

      - name: Publish coverage data
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" remote add origin "$remote"
          if git -C "$work" fetch -q --depth 1 origin coverage-data; then
            git -C "$work" checkout -q -b coverage-data FETCH_HEAD
          else
            git -C "$work" checkout -q --orphan coverage-data
          fi
          cp coverage-out/operator-coverage.md "$work/operator-coverage.md"
          rm -rf "$work/badges"
          cp -r coverage-out/badges "$work/badges"
          git -C "$work" add operator-coverage.md badges
          if git -C "$work" diff --cached --quiet; then
            echo "coverage data unchanged"
          else
            git -C "$work" -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update operator coverage data [skip ci]"
            git -C "$work" push -q origin coverage-data
          fi
